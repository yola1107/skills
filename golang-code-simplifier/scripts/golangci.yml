version: "2"
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - wastedassign
    - staticcheck
    - unused
    - unconvert
    - whitespace
  settings:
    govet:
      enable:
        - shadow
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1006
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    whitespace:
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
